<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TV Show Project | Edina Kurdi (edinakurdi)</title>
  <link href="style.css" rel="stylesheet" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
</head>

<body>
  <header>
    <h1>TV Show Project</h1>
  </header>
  <main>

    <section id="shows-view">
      //show listings to come here
      <!-- <label for="show-select">Choose a show</label>
      <select id="show-select">
        <option value="">Select a show...</option>
      </select> -->
    </section>

    <section id="episodes-view">

      <div class="controls-bar">

        <label for="episode-select">Choose an episode</label>
        <select id="episode-select">
          <option value="all">Show all episodes</option>
        </select>

        <label for="search">Search</label>
        <input type="text" id="search" placeholder="Search episodes...">

        <p id="count">Displaying <span id="count-result">0</span> episodes</p>
      </div>


      <div id="card-container"> Loading episodes...</div>

    </section>

  </main>

  <template id="show-card">
    <section class="show-card">
      <h2 data-show-name>Show title</h2>
      <img data-show-img src="" alt="">
      <p data-show-genres>Genres</p>
      <p data-show-status>Status</p>
      <p data-show-rating>Rating</p>
      <p data-show-runtime>Runtime</p>
      <div data-show-summary>Summary</div>
    </section>

  </template>

  <template id="episode-card">
    <section class="episode-card">
      <h2>Episode title</h2>
      <p data-episode-number>episode number</p>
      <img src="" alt="">
      <p data-summary>summary</p>
    </section>
  </template>

  <footer>
    <p> &copy; Edina Kurdi 2026 | Episode data originally from&nbsp;

      <a href="https://www.tvmaze.com/" target="_blank" rel="noopener noreferrer">
        TVMaze.com
      </a>
    </p>
  </footer>

  <script src="script.js"></script>
</body>

</html>
